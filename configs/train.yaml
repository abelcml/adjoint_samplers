defaults:
  - _self_
  - experiment: demo_asbs
  - lancher: demo_slurm

project: adjoint_sampler
train_itr_per_epoch: 100
init_stage: adjoint

seed: 0

# 是否裁「參數梯度」(train_loop.py 的 clip_grad_norm_),跟 max_grad_E_norm 裁迴歸目標是兩件事。
# 即使設 true,train_loop 裡的上限是 1e20,實際上不會觸發。
clip_grad_norm: false
checkpoint: null
save_freq: 100

timesteps:
  t0: 0.0
  t1: 1.0
  steps: ${nfe}
  rescale_t: ${rescale_t}

# === hardward related  ===
resample_batch_size: 512
train_batch_size: 512
eval_batch_size: 2000
num_eval_samples: ${eval_batch_size}
